name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    uses: jeffreycwitt/loyola-jekyll-cms-template/.github/workflows/reusable.yml@main
    with:
      theme: FA26_FR365
      group: FA26_FR365
    secrets:
      CMS_URL:      ${{ secrets.CMS_URL }}
      CMS_EMAIL:    ${{ secrets.CMS_EMAIL }}
      CMS_PASSWORD: ${{ secrets.CMS_PASSWORD }}
