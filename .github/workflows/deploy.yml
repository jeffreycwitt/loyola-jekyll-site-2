name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    uses: jeffreycwitt/loyola-jekyll-cms-template/.github/workflows/reusable.yml@main
    with:
      theme: academic
    secrets: inherit
