<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title and page.url != '/' %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Tokens ── */
    :root {
      --bg:          #F4EDD6;
      --surface:     #EAE0C4;
      --text:        #1A1308;
      --muted:       #6B5B3E;
      --accent:      #8C1A2E;
      --accent-pale: #F5DDE1;
      --gold:        #C49A3C;
      --border:      #D4C9A8;
      --hdr-bg:      #100D0A;
      --hdr-text:    #E8DEC7;
      --hdr-muted:   rgba(232,222,199,0.52);
      --hdr-gold:    #C49A3C;
      --ff-serif:    'EB Garamond', Georgia, serif;
    }
    @media (prefers-color-scheme: dark) { :root {
      --bg:          #100D0A;
      --surface:     #1C1712;
      --text:        #E8DEC7;
      --muted:       #9A8A6E;
      --accent:      #C4526A;
      --accent-pale: #281015;
      --gold:        #C49A3C;
      --border:      #2C261C;
    }}
    :root[data-theme="light"] {
      --bg: #F4EDD6; --surface: #EAE0C4; --text: #1A1308; --muted: #6B5B3E;
      --accent: #8C1A2E; --accent-pale: #F5DDE1; --gold: #C49A3C; --border: #D4C9A8;
    }
    :root[data-theme="dark"] {
      --bg: #100D0A; --surface: #1C1712; --text: #E8DEC7; --muted: #9A8A6E;
      --accent: #C4526A; --accent-pale: #281015; --gold: #C49A3C; --border: #2C261C;
    }

    /* ── Base ── */
    html { font-size: 18px; scroll-behavior: smooth; }
    body {
      font-family: var(--ff-serif);
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    main { flex: 1; }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }

    /* ── Site header — always dark, evoking a title page ── */
    .site-header {
      background: var(--hdr-bg);
      padding: 3rem 2rem 0;
      text-align: center;
    }
    .site-header-link { text-decoration: none; }
    .site-title {
      font-family: var(--ff-serif);
      font-size: clamp(2.25rem, 6vw, 3.75rem);
      font-weight: 400;
      letter-spacing: 0.04em;
      color: var(--hdr-gold);
      line-height: 1.1;
    }
    .site-description {
      margin-top: 0.5rem;
      font-family: var(--ff-serif);
      font-style: italic;
      font-size: 0.9rem;
      color: var(--hdr-muted);
      letter-spacing: 0.03em;
    }
    .site-nav {
      margin-top: 1.75rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2rem;
      border-top: 1px solid rgba(232,222,199,0.12);
      padding: 1.25rem 0;
    }
    .site-nav a {
      font-family: var(--ff-serif);
      font-size: 0.82rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--hdr-muted);
      text-decoration: none;
      transition: color 0.15s;
    }
    .site-nav a:hover { color: var(--hdr-text); }
    .theme-toggle {
      background: none;
      border: 1px solid rgba(232,222,199,0.22);
      border-radius: 2px;
      color: var(--hdr-muted);
      cursor: pointer;
      font-family: var(--ff-serif);
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.2rem 0.7rem;
      transition: color 0.15s, border-color 0.15s;
    }
    .theme-toggle:hover { color: var(--hdr-text); border-color: rgba(232,222,199,0.5); }

    /* ── Page wrapper ── */
    .page-wrap {
      max-width: 740px;
      margin: 0 auto;
      padding: 3.5rem 2rem 6rem;
    }

    /* ── Welcome section (index page only) ── */
    .welcome {
      padding-bottom: 2.75rem;
      margin-bottom: 2.75rem;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }
    .welcome-eyebrow {
      font-size: 0.78rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1rem;
    }
    .welcome h1 {
      font-family: var(--ff-serif);
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 400;
      line-height: 1.15;
      color: var(--text);
      margin-bottom: 1.25rem;
      text-wrap: balance;
    }
    .welcome p {
      font-size: 1rem;
      line-height: 1.85;
      color: var(--muted);
      max-width: 580px;
      margin: 0 auto;
    }

    /* ── Post index ── */
    .index-label {
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--text);
      margin-bottom: 0;
    }
    .post-list { list-style: none; }
    .post-list li { border-bottom: 1px solid var(--border); }
    .post-list-link {
      display: grid;
      grid-template-columns: 6.5rem 1fr;
      gap: 2rem;
      align-items: baseline;
      padding: 1.4rem 0;
      text-decoration: none;
      color: var(--text);
      transition: color 0.18s;
    }
    .post-list-link:hover { color: var(--accent); }
    .post-list-link:hover .post-list-date { color: var(--accent); }
    .post-list-date {
      font-style: italic;
      font-size: 0.85rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      padding-top: 0.2rem;
      transition: color 0.18s;
    }
    .post-list-title {
      font-family: var(--ff-serif);
      font-size: 1.35rem;
      font-weight: 400;
      line-height: 1.25;
      text-wrap: balance;
    }
    .post-list-author {
      display: block;
      font-style: italic;
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }
    .post-list-link:hover .post-list-author { color: var(--accent); }
    .empty-state {
      padding: 4.5rem 0;
      text-align: center;
      font-style: italic;
      font-size: 1.15rem;
      color: var(--muted);
    }

    /* ── Post page ── */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      margin-bottom: 2.75rem;
      transition: color 0.15s;
    }
    .back-link:hover { color: var(--accent); }
    .back-arrow { display: inline-block; width: 14px; height: 10px; position: relative; flex-shrink: 0; }
    .back-arrow::before { content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: currentColor; transform: translateY(-50%); }
    .back-arrow::after { content: ''; position: absolute; top: 50%; left: 0; width: 5px; height: 5px; border-left: 1px solid currentColor; border-bottom: 1px solid currentColor; transform: translateY(-50%) rotate(45deg); }
    .post-header { margin-bottom: 2.5rem; text-align: center; }
    .post-eyebrow {
      font-style: italic;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      color: var(--accent);
      margin-bottom: 1rem;
    }
    .post-title {
      font-family: var(--ff-serif);
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 400;
      line-height: 1.15;
      text-wrap: balance;
      margin-bottom: 1.1rem;
    }
    .post-author { font-style: italic; font-size: 0.95rem; color: var(--muted); margin-bottom: 1.5rem; }
    .post-rule { height: 1px; background: var(--border); border: none; margin: 0; }

    /* ── Post content ── */
    .post-content { font-size: 1.05rem; margin-top: 2.25rem; }
    .post-content p { line-height: 1.88; margin-bottom: 1.6rem; }
    .post-content p:last-child { margin-bottom: 0; }
    .post-content h1, .post-content h2, .post-content h3, .post-content h4 {
      font-family: var(--ff-serif);
      font-weight: 500;
      line-height: 1.2;
      text-wrap: balance;
      margin-top: 2.5rem;
      margin-bottom: 0.75rem;
    }
    .post-content h2 { font-size: 1.85rem; }
    .post-content h3 { font-size: 1.5rem; }
    .post-content h4 { font-size: 1.15rem; font-style: italic; }
    .post-content a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
    .post-content a:hover { text-decoration-thickness: 2px; }
    .post-content strong { font-weight: 600; }
    .post-content em { font-style: italic; }
    .post-content s { text-decoration: line-through; }
    .post-content code { font-size: 0.85em; background: var(--surface); border: 1px solid var(--border); border-radius: 2px; padding: 0.1em 0.35em; font-family: 'SF Mono', 'Fira Code', monospace; }
    .post-content ul, .post-content ol { padding-left: 1.6rem; margin-bottom: 1.5rem; }
    .post-content li { line-height: 1.82; margin-bottom: 0.3rem; }
    .post-content img { max-width: 100%; height: auto; margin: 2rem 0; display: block; border: 1px solid var(--border); }
    .post-content audio { width: 100%; margin: 2rem 0; display: block; }
    .post-content video { max-width: 100%; max-height: 480px; height: auto; margin: 2rem 0; display: block; border: 1px solid var(--border); }
    .video-embed { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; margin: 2rem 0; background: var(--surface); border: 1px solid var(--border); }
    .video-embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }

    /* ── About page ── */
    .about-content > h1 {
      font-family: var(--ff-serif);
      font-size: clamp(1.9rem, 4.5vw, 2.75rem);
      font-weight: 400;
      margin-bottom: 2.25rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }
    .about-section { margin-bottom: 2.25rem; }
    .about-section h2 {
      font-family: var(--ff-serif);
      font-size: 1.25rem;
      font-weight: 500;
      color: var(--accent);
      margin-bottom: 0.65rem;
      letter-spacing: 0.01em;
    }
    .about-section p {
      font-size: 1.05rem;
      line-height: 1.85;
    }
    .about-section a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

    /* ── Tags ── */
    .post-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 1rem; }
    .tag {
      display: inline-block;
      font-family: var(--ff-serif);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.2rem 0.65rem;
      border: 1px solid var(--border);
      border-radius: 1px;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s, border-color 0.15s;
    }
    .tag:hover { color: var(--accent); border-color: var(--accent); }
    .tag-section { margin-bottom: 2.5rem; }
    .tag-heading {
      font-family: var(--ff-serif);
      font-size: 0.82rem;
      font-style: italic;
      letter-spacing: 0.06em;
      color: var(--accent);
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0;
    }
    .post-list-tags { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.3rem; }
    .tag-chip { font-family: var(--ff-serif); font-style: italic; font-size: 0.78rem; color: var(--muted); }
    .tag-chip + .tag-chip::before { content: '·'; margin-right: 0.3rem; }

    /* ── Portfolios ── */
    .portfolio-header {
      padding-bottom: 2rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }
    .portfolio-title {
      font-family: var(--ff-serif);
      font-size: clamp(1.8rem, 4.5vw, 2.75rem);
      font-weight: 400;
      line-height: 1.2;
      text-wrap: balance;
      margin-bottom: 0.75rem;
    }
    .portfolio-description { font-size: 1rem; color: var(--muted); line-height: 1.75; }
    .portfolio-section { margin-bottom: 3rem; }
    .portfolio-section-header {
      padding-bottom: 1rem;
      margin-bottom: 0;
      border-bottom: 1px solid var(--border);
    }
    .portfolio-section-title {
      font-family: var(--ff-serif);
      font-size: 1.35rem;
      font-weight: 400;
      letter-spacing: 0.01em;
      color: var(--text);
    }

    /* ── Footer ── */
    .site-footer {
      border-top: 1px solid var(--border);
      padding: 1.5rem 2rem;
      text-align: center;
      font-family: var(--ff-serif);
      font-style: italic;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .site-footer a { color: var(--muted); text-decoration: none; }
    .site-footer a:hover { color: var(--accent); }

    /* ── Responsive ── */
    @media (max-width: 560px) {
      .site-header { padding: 2rem 1.25rem 0; }
      .page-wrap { padding: 2.5rem 1.25rem 4rem; }
      .post-list-link { grid-template-columns: 1fr; gap: 0.25rem; }
      .post-list-date { padding-top: 0; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="site-header-link" href="{{ '/' | relative_url }}">
      <div class="site-title">{{ site.title }}</div>
      {% if site.description %}<div class="site-description">{{ site.description }}</div>{% endif %}
    </a>
    <nav class="site-nav" aria-label="Primary">
      <a href="{{ '/' | relative_url }}">Student Writings</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
      <a href="{{ '/tags/' | relative_url }}">Tags</a>
      {% if site.data.portfolios %}<a href="{{ '/portfolios/' | relative_url }}">Portfolios</a>{% endif %}
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">Dark</button>
    </nav>
  </header>

  <main>
    <div class="page-wrap">
      {{ content }}
    </div>
  </main>

  <script>
    (function() {
      var btn = document.getElementById('theme-toggle');
      var root = document.documentElement;
      function getStored() { try { return localStorage.getItem('theme'); } catch(e) { return null; } }
      function setStored(t) { try { localStorage.setItem('theme', t); } catch(e) {} }
      function apply(theme) {
        root.setAttribute('data-theme', theme);
        btn.textContent = theme === 'dark' ? 'Light' : 'Dark';
        btn.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
      }
      var stored = getStored();
      var initial = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      apply(initial);
      btn.addEventListener('click', function() {
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        apply(next); setStored(next);
      });
    })();
  </script>

  <footer class="site-footer">
    {{ site.title }} &ensp;&middot;&ensp; Loyola University Maryland
  </footer>
</body>
</html>
